## cava config for the control-room TV pane only — deliberately separate
## from ~/.config/cava/config (waybar's cava module uses that one for real
## system audio). This one only reacts to control_room_tts.monitor, the
## dedicated null-sink control-room-voice.py's TTS speech is routed to, so
## the visualizer only moves when Claude is actually speaking.

[input]
method = pulse
source = control_room_tts.monitor
