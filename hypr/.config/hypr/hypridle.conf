# armojidots-hypr — hypridle
# 2.5 min idle -> dim DP-2 (OLED, bus 10 via ddcutil/DDC-CI). 5 min -> lock.
# 7 min -> screen off (on again on activity). Always lock before sleep.
# (mirrors sway's swayidle/config)
#
# The dim + shortened lock->DPMS gap are both specifically for DP-2's OLED
# panel: wear scales with brightness x time, not just "is the image static"
# (the monitor's own pixel-refresh/logo-dimming already handles the static-
# image case). Dimming during the pre-lock idle window, and cutting how long
# a static, moderately bright lock screen sits lit before DPMS actually
# blanks it, both reduce that. HDMI-A-2 is a plain non-OLED panel, not
# touched here.

general {
    before_sleep_cmd = hyprlock
}

# DP-2 goes fully black after just 1 minute idle — always on, not a
# toggle, no waybar/keybind switch for it (deliberately, Armin asked for
# this to be unconditional). This is stricter than the dim/lock/off chain
# below, which still applies as-is for the other panels; ddcutil dimming
# at 150s below becomes a harmless no-op for DP-2 specifically once it's
# already DPMS-off (DDC-CI can't reach a display that's off).
#
# The Lua-config `hyprctl dispatch` build here needs `hl.dsp.dpms({...})`,
# not the legacy `dpms off DP-2` string form (that errors outright — the
# 420s listener below used to use that broken form for years unnoticed,
# since a silent no-op is easy to miss). Also a real quirk worth
# remembering: `status="off"` reliably sets off, but `status="on"` does
# NOT reliably turn on — it (and anything else that isn't literally
# "off") behaves like a TOGGLE instead, confirmed live.
#
# on-resume uses dpms-wake.sh instead of a blind toggle: it checks the
# real current dpms state first and only toggles monitors that are
# actually off, self-correcting instead of assuming "on-resume always
# means it was off" — that assumption broke once already after a
# crash+reboot left duplicate processes racing each other, and the
# monitor got stuck black with input not waking it (see [[oled-idle-off]]).
listener {
    timeout = 60
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({status="off", monitor="DP-2"})'
    on-resume = ~/.local/bin/dpms-wake.sh DP-2
}

listener {
    timeout = 150
    on-timeout = ddcutil --bus 10 setvcp 10 30 2>/dev/null
    on-resume = ddcutil --bus 10 setvcp 10 100 2>/dev/null
}

listener {
    timeout = 300
    on-timeout = hyprlock
}

listener {
    timeout = 420
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({status="off"})'
    on-resume = ~/.local/bin/dpms-wake.sh
}
