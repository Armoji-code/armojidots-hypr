# armojidots-hypr — hypridle
# hyprlock is intentionally NOT wired up here — Armin wants it manual-only
# (Spotlight's /power Lock, or Win+L), not auto-triggered by idle or before
# sleep. Idle now only does two things: the OLED screensaver, and DPMS-off
# after a while. (mirrors sway's swayidle/config)

# After 1 minute idle, a real Wayland screensaver (hyprsaver, AUR) covers
# every connected monitor with an animated GLSL shader — content
# replacement, not just dimming, and unlike ddcutil-dimming or a plain
# black window, moving content is the actual textbook fix for burn-in
# (uniform static value still wears the panel evenly over time; motion
# means no pixel sits at one brightness long enough to matter). Replaces
# the old DP-2-only DPMS-off + 150s ddcutil-dim-to-30 pair — see
# [[oled-idle-off]] for the full history of what didn't work here
# (custom fullscreen kitty overlay window: self-cancelled hypridle's own
# idle state on every window-creation/fullscreen-toggle, chased most of a
# day before scrapping it for this).
#
# hyprsaver renders via wlr-layer-shell (a real screensaver surface type),
# not a toplevel window — the specific thing that kept silently
# re-triggering Hyprland's idle-notifier "Resumed" event with the old
# overlay-window approach. dismiss_on in hyprsaver.toml (key/mouse
# move/click/touch, all on by default) means it exits itself on real
# input; on-resume here still explicitly --quits it as a backstop in case
# hypridle's own resume fires first.
listener {
    timeout = 60
    on-timeout = hyprsaver
    on-resume = hyprsaver --quit
}

listener {
    timeout = 420
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({status="off"})'
    on-resume = ~/.local/bin/dpms-wake.sh
}
