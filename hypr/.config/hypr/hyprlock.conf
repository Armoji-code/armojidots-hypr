# generated by theme.sh — palette: emerald
general {
    ignore_empty_input = true
    hide_cursor = false
}

background {
    monitor =
    path = ~/dotfiles/wallpapers/current
    blur_passes = 2
    blur_size = 8
    noise = 0.02
    contrast = 0.9
    brightness = 0.65
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(d1efdfff)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %e')"
    color = rgba(d1efdfff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(78cfa0ff)
    inner_color = rgba(0e2117cc)
    font_color = rgba(d1efdfff)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    check_color = rgba(78cfa0ff)
    fail_color = rgba(e06c75ff)
    position = 0, -60
    halign = center
    valign = center
}
